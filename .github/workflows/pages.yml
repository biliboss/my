name: Publish the family pages

# UM monorepo, QUATRO sites. O Pages publica um site por repositório, então o
# `apps/my` sai daqui mesmo (biliboss.github.io/my/) e os outros três são
# empurrados pro branch `gh-pages` do repo de cada um — que continua sendo o
# dono da URL que já está publicada.
#
# O que isso preserva: as quatro URLs, o og:image, o canonical e o sitemap que
# já estão no ar. O que custa: um segredo, `FAMILY_PAGES_TOKEN`, fine-grained
# com Contents:write em biliboss/my-graph, my-company e my-kanban.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      # o pacote compila ANTES das apps: elas importam `dist`, não `src`
      - run: bun run --filter '@biliboss/my-ui' build
      - run: bun run --filter './apps/*' build
      - uses: actions/upload-artifact@v4
        with:
          name: sites
          path: apps/*/dist
          retention-days: 1

  # o próprio repo: biliboss.github.io/my/
  deploy-my:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: sites, path: sites }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: sites/lp_my/dist }
      - id: deployment
        uses: actions/deploy-pages@v4

  # os outros três: o dist viaja pro branch `gh-pages` do repo de cada um
  deploy-siblings:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # `dir` é a pasta no monorepo, `repo` é o dono da URL publicada. Os dois
        # divergiram quando as apps ganharam o prefixo `lp_`, e confundir um com
        # o outro publica o site certo no repositório errado.
        include:
          - { dir: lp_my-graph, repo: my-graph }
          - { dir: lp_my-company, repo: my-company }
          - { dir: lp_my-kanban, repo: my-kanban }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: sites, path: sites }
      - name: Push to ${{ matrix.repo }}
        env:
          TOKEN: ${{ secrets.FAMILY_PAGES_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "::error::falta o segredo FAMILY_PAGES_TOKEN"; exit 1; }
          cd sites/${{ matrix.dir }}/dist
          # `.nojekyll` senão o Pages engole todo diretório que começa com `_`
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build de biliboss/my@${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:$TOKEN@github.com/biliboss/${{ matrix.repo }}.git" gh-pages

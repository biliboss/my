name: Publish the doors

# UM BUILD, UM DESTINO.
#
# Antes disto: quatro apps Vite, uma por REPOSITÓRIO, e o custo de uma porta
# nova era app + entrada aqui + o segredo `FAMILY_PAGES_TOKEN` pra empurrar o
# dist pro repo dono da URL. Quatro sites, quatro canonicals, quatro analytics,
# e nenhuma forma de perguntar "quais portas existem?" sem abrir quatro repos.
#
# Agora: `apps/lp` e UM Next com `output: "export"`, servido de
# biliboss.github.io/my/, com uma ROTA por fatia de publico. Uma porta nova e
# `my lp new <fatia>` — uma pasta e uma rota, sem tocar neste arquivo.
#
# AS QUATRO PASTAS FORAM APAGADAS em 22/08 (`apps/lp_my`, `lp_my-graph`,
# `lp_my-kanban`, `lp_my-company`). O que elas tinham e `apps/lp` nao tinha veio
# junto, e nao ficou pra tras: os cinco shots do extrator estao em
# `apps/lp/public/shots/`, o catalogo de 156 fontes virou a rota `/metodo`, e as
# duas demos que rodam (o grafo da empresa e o quadro que troca de eixo) moram
# em `packages/lp-slices/`. O que morreu foi a COPIA de cada landing, que as
# cinco rotas ja reescreveram.
#
# O QUE ISTO PRESERVA: as tres URLs irmas ja publicadas. Elas passam a servir um
# redirecionamento pra rota equivalente no dominio unico, em vez de um segundo
# site com a mesma copia — duas paginas com a mesma copia e o que a busca trata
# como duplicata, e some com as duas. O job fica ate alguem decidir aposentar as
# URLs; enquanto os tres repos existirem, sem ele eles servem um site morto.

on:
  push:
    branches: [main]
    paths:
      - "apps/lp/**"
      - "packages/lp-slices/**"
      - "packages/my-ui/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile

      # O pacote compila ANTES da app: `apps/lp` importa `@biliboss/my-ui` por
      # `dist`, nao por `src`.
      - run: bun run --filter '@biliboss/my-ui' build

      # O PORTAO ANTES DO BUILD: rota sem canonical, sem og, sem CTA, com CTA
      # repetido ou com copia igual a de outra rota nao vai pro ar. Ele roda aqui
      # e DE NOVO depois do build — antes ele le a declaracao, depois le o HTML
      # que saiu. Declaracao certa com `metadata` desligado passa no primeiro e
      # e pega no segundo.
      - name: as portas, pela declaracao
        run: bun run src/lp/check.ts
        working-directory: apps/my_cli

      - run: bun run --filter '@my/lp' build

      - name: as portas, pelo HTML publicado
        run: bun run src/lp/check.ts
        working-directory: apps/my_cli

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/lp/out
          retention-days: 1

  # O UNICO DESTINO: biliboss.github.io/my/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: site, path: site }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4

  # As tres URLs que ja estavam no ar passam a APONTAR pro destino unico.
  # Nao e um segundo destino: e o encaminhamento do endereco velho, e ele existe
  # so ate alguem decidir aposentar as URLs.
  redirect-siblings:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { repo: my-graph, route: codigo }
          - { repo: my-company, route: empresa }
          - { repo: my-kanban, route: kanban }
    steps:
      - name: Redirect ${{ matrix.repo }} to /${{ matrix.route }}
        env:
          TOKEN: ${{ secrets.FAMILY_PAGES_TOKEN }}
          TARGET: https://biliboss.github.io/my/${{ matrix.route }}/
        run: |
          test -n "$TOKEN" || { echo "::error::falta o segredo FAMILY_PAGES_TOKEN"; exit 1; }
          mkdir -p redirect && cd redirect
          # `canonical` E `refresh`: o canonical e pro buscador nao contar duas
          # paginas, o refresh e pra pessoa chegar la. O Pages nao emite 301.
          cat > index.html <<HTML
          <!doctype html>
          <html lang="pt-BR">
          <head>
          <meta charset="utf-8">
          <title>Mudou de endereco</title>
          <link rel="canonical" href="$TARGET">
          <meta http-equiv="refresh" content="0; url=$TARGET">
          <meta name="robots" content="noindex">
          </head>
          <body><p>Esta pagina mudou para <a href="$TARGET">$TARGET</a>.</p></body>
          </html>
          HTML
          cp index.html 404.html
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # arquivo por arquivo, e nao um curinga: e a regra do CLAUDE.md desta
          # casa, e aqui ela tambem impede que um resto de build entre no push.
          git add index.html 404.html .nojekyll
          git commit -q -m "redirect para biliboss/my@${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:$TOKEN@github.com/biliboss/${{ matrix.repo }}.git" gh-pages

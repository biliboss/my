# TEMPLATE — `_step_runs/<run-id>/input.yaml` do sub-verb `projects`.
#
# Igual ao @03_resources/templates/system/projects/input.yaml (summary no topo, env embaixo) mais o que este
# processo tem de diferente: ele é STATEFUL. O arquivo é reescrito a cada
# rodada — é o estado vivo do projeto até alguém aprovar, e não a foto imutável
# do disparo.

summary:
  run: <timestamp-slug-run>
  node: projects

  comecou: <iso8601>             # início do LEAD TIME. Não se mexe nunca mais.

  pedido: >-
    <o pedido original, VERBATIM>

  estado: rascunho               # rascunho | em_revisao | aprovado | descartado
                                 # SÓ `aprovado` libera o output.yaml. Enquanto
                                 # não for, o processo não terminou — não
                                 # existe "quase pronto" que gere entrega.

  guardrail:
    altera_arquivos: <bool>

# --- o projeto sendo desenhado ------------------------------------------------
# Os mesmos campos que o doc em 01_projects/<slug>/ vai carregar. Ficam aqui
# primeiro porque é isto que está em revisão — o doc é a consequência.
projeto:
  slug: <project-slug>
  resultado: <o que existe no mundo quando isto acabar>
  prazo: <data>
  dono: <nome>
  serve_area: 02_areas/NN-<slug>/<slug>.md
  escopo:
    - <item>
  fora_de_escopo:
    - <item>
  pronto_quando: <o teste que decide, sem discussão>

# --- as voltas até alguém aprovar ---------------------------------------------
# Uma entrada POR RODADA, append-only. Apagar rodada é apagar a medida de
# quanto o desenho custou — quantas voltas o projeto deu não tem substituto
# no git nem no hook, então mora aqui e só aqui.
rodadas:
  - n: 1
    aberta_em: <iso8601>
    fechada_em: <iso8601>        # quando o humano respondeu
    veredito: <mudar|aprovar|descartar>
    o_que_mudou: >-
      <o que a resposta do humano obrigou a mexer>

env:
  workdir: <pwd>
  git:
    remote: <url ou "">
    branch: <branch>
    commit: <sha>
    dirty: <bool>
  sessao:
    claude_session_id: <$CLAUDE_CODE_SESSION_ID>
    herdr_pane: <$HERDR_PANE_ID>
    herdr_tab: <$HERDR_TAB_ID>
    herdr_workspace: <$HERDR_WORKSPACE_ID>
  present:
    - <NOME_DA_VAR>

# TEMPLATE — `_step_runs/<run-id>/projects.yaml`, o fechamento do sub-verb.
#
# ESTE ARQUIVO SÓ EXISTE DEPOIS DE `summary.estado: aprovado`. Antes disso não
# há output parcial: um processo com gate que entrega "quase" não tem gate.
#
# Sem bloco de métricas — a maioria dos yamls antigos tinha o número zerado
# (medido 15/08/2026, @_meta/003_run/interview.yaml#evidence). Campo copiado
# à mão depende de alguém lembrar de preencher; a fonte não depende de
# ninguém lembrar. De onde vem cada número, quando alguém precisar dele:
#
#   lead time    -> `git log --format=%cI` do primeiro commit da branch da
#     task até o `%cI` do merge em staging.
#   entrega      -> `git show --stat` do commit.
#   espera humana -> src/system/metrics/askuser.ts, que carimba o popup
#     pelo PreToolUse/PostToolUse do harness — não pelo relato de quem
#     respondeu.
#
# Quantas voltas até aprovar morre sem substituto: nem git nem hook
# respondem isso, e a maioria dos valores medidos era 0. Se doer, volta como
# pergunta nova.

# --- o gate -------------------------------------------------------------------
aprovacao:
  por: <quem aprovou>
  em: <iso8601>
  como: <my askuser ask | mensagem no chat | popuper>
  o_que_aprovou: >-
    <o texto exato que foi aprovado — não "o projeto", mas o resultado e o
    prazo que estavam na tela quando a pessoa disse sim>

# --- o que ficou no mundo -----------------------------------------------------
entregue:
  projeto: 01_projects/<project_slug>/<project_slug>.md
  arquivos:
    - <outro arquivo criado na pasta do projeto>

files_visited:                    # prova de trabalho — o research passou por aqui
  - path: <caminho, ou "whatsapp:<grupo>", ou "prod:<host>">
    reason: <o que este material decidiu no projeto>

nao_virou:                        # o que foi pedido e ficou de fora
  - do_pedido: <o item>
    porque: <por que não coube>

pendente:                         # o que o projeto não resolve e alguém precisa saber
  - <item>

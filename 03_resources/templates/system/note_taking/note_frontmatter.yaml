# TEMPLATE — o frontmatter de toda nota Zettelkasten.
# Copie este bloco entre `---` no topo de `03_resources/notes/<timestamp>_<slug>.md`.
# Campo aqui é campo que alguém LÊ; se ninguém consulta, não entra.

id: <YYYY-MM-DDTHHMMZ>   # `date -u +%Y-%m-%dT%H%MZ` — IMUTÁVEL.
                         # É o que os links das outras notas apontam. O slug
                         # do arquivo pode mudar; o id, nunca.

criado: <iso8601>        # quando a ideia foi escrita, não quando ocorreu

fonte: <run/conversa/arquivo/link, ou "cabeça">
                         # de onde a ideia veio. "cabeça" é resposta válida —
                         # o que não é válido é não saber.

links:                   # a nota vira útil AQUI. Nota sem link é nota perdida.
  - id: <YYYY-MM-DDTHHMMZ>
    porque: <o que uma diz sobre a outra — não só o alvo>

refs:                    # ponteiros pro repo, a partir da raiz
  - @<caminho/no/repo>
